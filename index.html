<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ejercicio de Git Flow para FIS."
    />
    <title>Recetas</title>
    <link rel="icon" href="src/interface/favicon.ico" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="src/interface/style.css" rel="stylesheet" />
  </head>

  <body>
    <nav class="navbar navbar-expand">
      <a class="navbar-brand ps-2" href="#">Recetas</a>
      <div class="nav nav-pills" id="nav-tab" role="tablist">
        <button
          class="nav-link active me-3"
          id="nav-add-recipe-tab"
          data-bs-toggle="tab"
          data-bs-target="#nav-add-recipe"
          type="button"
          role="tab"
          aria-controls="nav-add-recipe"
          aria-selected="true"
        >
          Agregar receta
        </button>
        <button
          class="nav-link"
          id="nav-recipes-list-tab"
          data-bs-toggle="tab"
          data-bs-target="#nav-recipes-list"
          type="button"
          role="tab"
          aria-controls="nav-recipes-list"
          aria-selected="false"
        >
          Lista de recetas
        </button>
      </div>
    </nav>
    <div class="tab-content" id="nav-tabContent">
      <div
        class="tab-pane fade show active"
        id="nav-add-recipe"
        role="tabpanel"
        aria-labelledby="nav-add-recipe-tab"
      >
        <div id="alerts"></div>
        <div class="container shadow bg-white rounded">
          <div class="row">
            <div class="col-sm-4 p-0 fill">
              <img
                src="./src/interface/img/recipe.jpg"
                alt="Ingredientes y receta de cocina"
                id="add-recipe-image"
                class="rounded-start w-100 d-block mx-auto"
              />
            </div>
            <div class="col-sm-8 pt-2 px-4">
              <h1 class="title">Registro de recetas</h1>
              <form id="register-form">
                <div class="row">
                  <div class="col-sm">
                    <label for="inp-name" class="form-label">Nombre:</label>
                    <input
                      type="text"
                      class="form-control"
                      id="inp-name"
                      name="name"
                      placeholder="Ingrese el nombre"
                      required
                    />
                  </div>
                </div>
                <div class="row">
                  <div class="col-sm pt-3">
                    <label for="inp-category" class="form-label">Categoría:</label>
                    <select class="form-select" id="inp-category" name="category">
                      <option value="" selected>Seleccione una categoría</option>
                      <option value="Entrada">Entrada</option>
                      <option value="Sopa">Sopa</option>
                      <option value="Plato principal">Plato principal</option>
                      <option value="Guarnición">Guarnición</option>
                      <option value="Postre">Postre</option>
                      <option value="Desayuno">Desayuno</option>
                      <option value="Bebida">Bebida</option>
                      <option value="Otro">Otro</option>
                    </select>
                  </div>
                </div>
                <div class="row">
                  <div class="col-sm pt-3">
                    <label for="inp-prep-time" class="form-label">Tiempo de preparación (minutos):</label>
                    <input
                      type="number"
                      class="form-control"
                      id="inp-prep-time"
                      name="prep-time"
                      min="0"
                      required
                    />
                  </div>
                </div>
                <div class="d-none" id="add-recipes-error">
                  <p class="text-danger pt-2" id="add-recipes-error-msg"></p>
                </div>
                <div class="row-sm py-3 text-end">
                  <button id="btn-add" type="button" class="btn btn-primary">
                    Agregar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div
        class="tab-pane fade"
        id="nav-recipes-list"
        role="tabpanel"
        aria-labelledby="nav-recipes-list-tab"
      >
        <h2
          class="position-absolute top-50 start-50 translate-middle"
          id="empty-list"
        >
          No ha ingresado ninguna receta :(
        </h2>
        <div
          id="recipes"
          class="container shadow bg-white rounded mt-4 p-2 d-none"
        >
          <h1 class="title ps-2">Recetas:</h1>
          <ul id="recipes-list" class="list-group-numbered"></ul>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="src/interface/main.ts" type="module"></script>
  </body>
</html>
